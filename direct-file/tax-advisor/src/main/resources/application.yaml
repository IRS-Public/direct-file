spring:
  application:
    name: tax-advisor
  main:
    banner-mode: off
  ai:
    mcp:
      server:
        # Identity advertised in the MCP initialize handshake.
        name: tax-advisor
        version: 0.0.1
        # Guidance returned in the MCP initialize handshake. MCP clients typically
        # surface this at system-prompt level, so it is the strongest lever for making
        # the calling LLM DEFER to this server instead of answering tax questions from
        # its own (often subtly wrong) priors. Keep it short and directive; the concrete
        # mileage example is load-bearing — it is the canonical case a general model
        # gets wrong.
        instructions: >-
          This server encodes IRS-correct tax-planning logic for self-employed and
          gig/delivery filers. Defer to it: do not invent tax interview questions,
          amounts, or rules from general knowledge.


          Before asking the taxpayer any interview question, call plan_questions and ask
          what it returns, in the order returned — its sequencing reflects tax rules a
          general model gets wrong. Example: for a driver it asks for business MILES,
          not gas/maintenance/phone receipts, because the standard mileage rate already
          includes those costs, so itemizing them on top would double-count.


          For any figure (self-employment tax, the QBI deduction, quarterly estimated
          payments, net profit, total tax), call the matching calculation tool rather
          than estimating, and use cite/explain to show the IRS source behind it. Treat
          candidate facts as values to CONFIRM with the taxpayer, never as established.


          Filing status: for a quick set-aside estimate, default to single and SAY SO —
          self-employment tax (usually most of a gig driver's bill) does not depend on
          filing status; only income tax does. Status is fixed when a session is created.
          If the taxpayer is married or asks whether status changes their tax, do not
          estimate the difference — call compare_filing_statuses to get computed totals
          for single / MFJ / MFS on the same income.
        # SYNC keeps the blocking tool implementations (fact-graph calls) as-is; the
        # WebFlux transport dispatches them off the event loop. ASYNC is only useful
        # if individual tools become non-blocking.
        type: SYNC
        # Streamable HTTP transport (MCP spec 2025-03-26+), served by the WebFlux
        # starter: a single endpoint handles POST (JSON-RPC requests) and GET (SSE
        # stream for server->client messages), replacing the older HTTP+SSE two-endpoint
        # transport. An LLM gateway connects to this one URL.
        enabled: true
        protocol: STREAMABLE
        streamable-http:
          mcp-endpoint: /mcp
        capabilities:
          tool: true
          resource: false
          prompt: false
          completion: false

server:
  port: 8090

# Expose metrics alongside health so the PII-free tool-call telemetry (ToolCallTelemetry:
# taxadvisor.tool.calls / .errors / .latency) is observable at /actuator/metrics. These
# counters carry only tool name + outcome + exception class — never taxpayer values.
management:
  endpoints:
    web:
      exposure:
        include: health,metrics

tax-advisor:
  tax-knowledge-root: ${DF_TAX_KNOWLEDGE_ROOT:../tax-knowledge}
  fact-xml-patterns:
    - classpath*:/tax/*.xml
    - classpath*:/tax-plan/*.xml

# The production FactGraphService is reused for its XML processor; we disable its
# own @PostConstruct loader so the planning service can control patterns itself.
direct-file:
  loader:
    load-at-startup: false
    fact-dictionary-xml-pattern: "classpath:/tax/*.xml"

logging:
  level:
    com.realworld.tax.advisor: TRACE
    org.springframework.web: TRACE
